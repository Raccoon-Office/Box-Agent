# Box Agent Configuration
#
# Configuration File Locations (in priority order):
# 1) box_agent/config/config.yaml - Development mode (current directory)
# 2) ~/.box-agent/config/config.yaml - User config directory
# 3) <package>/box_agent/config/config.yaml - Package installation directory
#
# Fill in your API key and customize settings as needed

# ===== LLM Configuration =====
# Supported providers:
#   "anthropic" — Anthropic-compatible APIs (Anthropic, etc.)
#   "openai"    — OpenAI-compatible APIs (OpenAI, DeepSeek, SiliconFlow, etc.)
#
# Example api_base values:
#   Anthropic   : https://api.anthropic.com
#   OpenAI      : https://api.openai.com/v1
#   DeepSeek    : https://api.deepseek.com
#   SiliconFlow : https://api.siliconflow.cn/v1
api_key: "YOUR_API_KEY_HERE"
api_base: "https://api.anthropic.com"
model: "claude-sonnet-4-20250514"
provider: "anthropic"
# Provider dialect: models whose name starts with sensenova-/sn-sensenova- use
# SenseNova thinking parameters and pseudo-tool-call recovery. This is an
# operator-only compatibility override: only add a family after verifying its
# request/response contract. Prefixes must end in -, _, /, :, or . and are
# comma/whitespace-separated; built-ins are always kept:
#   export BOX_AGENT_SENSENOVA_MODEL_PREFIXES="my-family-,another-"
# Hosted officev3 login auth lives outside config.yaml so token refreshes do not
# mark model/provider config dirty. Before each LLM request, xiaohuanxiong.com
# providers refresh a near-expiry JWT with auth.json's refresh_token and
# atomically persist rotated tokens. URL-based MCP connections read the same file.
# auth_file: "/path/to/auth.json"

# Model token budget. `context_window` is the total context the model accepts;
# `max_output_tokens` is the per-request output cap (`max_tokens` on the wire).
# Default for user-configured endpoints stays below the common 65,536
# output-token ceiling. Hosted xiaohuanxiong.com endpoints default to 80,000
# when this field is omitted. The summarization trigger is derived: 90% of
# (context_window - max_output_tokens). ACP built-in model bindings may override
# both values per model; these fields remain the fallback for custom endpoints.
context_window: 180000
max_output_tokens: 63999

# Per-request wall-clock cap (seconds) handed to the provider SDK. For streaming
# calls this bounds the gap between bytes (connect + per-read), not the total
# generation — a long answer is fine as long as tokens keep flowing. Defaults to
# the SDK default of 600. Lower it to fail fast with a clean error instead of
# hanging when a gateway stalls before the first token.
timeout: 600.0

# ===== Lite LLM (Optional) =====
# Lightweight model for small, tool-free tasks: session-title generation,
# one-shot summaries, rewrites, etc.
# Leave this block out (or comment it) to route everything to the main LLM.
# Same auth rules as the main block: hosted gateways read auth.json when api_key is empty.
# lite_llm:
#   provider: "openai"
#   api_base: "https://api.openai.com/v1"
#   api_key: "YOUR_LITE_API_KEY"
#   model: "gpt-4o-mini"
#   max_output_tokens: 63999   # hard ceiling: 65536. Most lite endpoints reject larger values.

# ===== Retry Configuration =====
retry:
  enabled: true # Enable retry mechanism
  max_retries: 3 # Maximum number of retries
  initial_delay: 1.0 # Initial delay time (seconds)
  max_delay: 60.0 # Maximum delay time (seconds)
  exponential_base: 2.0 # Exponential backoff base (delay = initial_delay * base^attempt)

# ===== Agent Configuration =====
# Runtime defaults live in AgentConfig; uncomment only deliberate overrides so
# packaged runtime updates can revise defaults without rewriting user config.
# max_steps: 300 # Maximum execution steps
max_parallel_tools: 8 # Hard cap on concurrent parallel_safe tool calls (sub_agent, generate_image) per step
parallel_tool_timeout_seconds: 900 # Per-step wall-clock cap for one parallel_safe tool batch
# provider_stale_seconds: 300 # Seconds without a new provider chunk before a stream is treated as stale.
#                             # Raise for slow/deep-thinking models; env BOX_AGENT_PROVIDER_STALE_SECONDS overrides.
# sub_agent_token_limit: 50000 # Per-call child context budget
# sub_agent_batch_synthesis_timeout_seconds: 600 # files batch synthesis call; 0 disables this extra cap
workspace_dir: "./workspace" # Working directory
system_prompt_path: "system_prompt.md" # System prompt file (same config directory)
analysis_prompt_path: "analysis_prompt.md" # Extra prompt for data_analysis sessions
code_prompt_path: "code_prompt.md" # Extra prompt for code_agent sessions

# Suspected-truncation continuation: if a reply ends mid-sentence while the
# provider reports a normal finish (or omits it), inject a one-shot
# continuation so the answer finishes within the same message. Detection is
# conservative (only fires on a clearly unfinished ending). Default on.
retry_on_suspected_truncation: true # Auto-continue a reply cut off mid-sentence
context_resource_dedup_enabled: true # Session-local read_file receipts and reconstructable resource shedding
max_truncation_continuations: 1 # Max continuations per turn (loop guard)

# ===== Optional Tool Execution Limit Overrides =====
# Tool-limit defaults live only in box_agent/config.py. Keep this block absent
# to inherit the defaults shipped by each runtime update. Uncomment only the
# specific values that should remain user-controlled across upgrades.
# tool_limits:
#   general:
#     final_summary_after_calls: 200 # 1..512; request a final summary after this many visible tool calls
#     wrapup_remaining_steps: 10 # 0..50; start wrapping up this many steps before max_steps
#   completion:
#     max_continuations: 5 # 0..20; forced continuations for incomplete deliverables
#     deadline_seconds: 1800 # 1..14400; continuation deadline, not a tool kill timeout
#   web_search:
#     batch_size: 8 # 1..32; web searches allowed in one agent step
#     concurrency: 2 # 1..batch_size; parallel searches in a search-only agent step
#     total_calls: 80 # 0..512; ordinary per-turn web-search budget
#     deep_research_total_calls: 150 # 0..512; deep-research per-turn web-search budget
#   search_files:
#     consecutive_empty_limit: 8 # 1..50; stop repeated file searches after empty results
#   external_skill:
#     max_tool_calls: 160 # 1..512; total tool-call budget
#     max_delegated_tool_calls: 512 # 1..4096; separate aggregate child-tool budget
#     completion_reserve_calls: 10 # 0..128 and <= max_tool_calls
#   presentation:
#     max_tool_calls: 160 # 1..512; normal presentation budget
#     max_delegated_tool_calls: 512 # 1..4096; separate aggregate child-tool budget
#     completion_reserve_calls: 10 # 0..128 and <= both presentation call budgets
#     deep_research_max_tool_calls: 240 # 1..512; deep-research presentation budget
#     research_rounds: 5 # 1..20; research rounds before requiring artifact handoff
#   sub_agent:
#     general_max_steps: 80 # 1..256; declared sub-agent step cap
#     legacy_max_steps: 60 # deprecated compatibility field; no separate legacy loop
#     general_max_tool_calls: 48 # 1..256; declared sub-agent tool-call cap
#     no_progress_steps: 8 # 1..50; stop after consecutive no-progress steps

# ===== Memory Configuration =====
enable_memory: true # Enable cross-session memory system
memory_dir: "~/.box-agent/memory" # Memory storage directory

# ===== Memory Auto-Extraction =====
enable_memory_extraction: true # Auto-extract memories at lifecycle points
memory_extraction_cooldown: 300 # Seconds between extractions (prevents LLM spam)
memory_extraction_step_interval: 10 # Extract every N agent steps

# ===== Tools Configuration =====
tools:
  # Safety: restrict tools to workspace directory only
  allow_full_access: false # true: tools can access full system; false: restricted to workspace

  # Basic tool switches
  enable_file_tools: true # File read/write/append/edit tools (ReadTool, WriteTool, AppendTool, EditTool)
  enable_bash: true # Bash command execution tool
  bash_default_timeout_seconds: 300 # Foreground command timeout when omitted
  bash_max_timeout_seconds: 1200 # Maximum foreground command timeout
  enable_todo: true # Task tracking tool (TodoWriteTool, TodoReadTool)
  enable_plan: true # Structured planning tool (PlanWriteTool, PlanReadTool)

  # Claude Skills
  enable_skills: true # Enable Skills
  skills_dir: "./skills" # Skills directory path

  # MCP Tools
  enable_mcp: true # Enable MCP tools
  mcp_config_path:
    "mcp.json" # MCP configuration file (same config directory)
    # Note: API Keys for MCP tools are configured in mcp.json
  # MCP timeout configuration (prevents hanging on network issues)
  mcp:
    # Hide ordinary MCP schemas until tool_search activates them for a session.
    deferred_loading_enabled: true
    connect_timeout: 60.0 # Connection timeout in seconds (default: 60)
    execute_timeout: 120.0 # Tool execution timeout in seconds (default: 120)
    sse_read_timeout: 180.0 # SSE read timeout in seconds (default: 180)

# ===== Image Generation Service =====
# The built-in generate_image tool reads this block the same way LLM requests
# read api_base/api_key/auth_file. Text-to-image posts JSON to endpoint.
# Image-to-image edits derive /images/edits from /images/gen and post multipart
# fields: image, prompt, size. If api_key is empty and the endpoint is a hosted
# officev3 domain, Box-Agent reuses auth.json / BOX_AGENT_AUTH_TOKEN.
image_generation:
  endpoint: "http://10.158.136.99:9000/api/web/llm/v2/images/gen" # e.g. "https://your-service/v1/images/generations"
  api_key: "" # optional dedicated bearer token; leave empty to reuse hosted auth
  model: "gpt-image-1"
  timeout: 300.0
  max_dimension: 1024 # Longest-edge cap for generic/custom OpenAI-compatible endpoints that would
  #                     otherwise forward an oversized `size` unchanged (and 504). OpenAI, Doubao/Seedream,
  #                     and host-aligned `/images/gen` endpoints keep their own rules. 0 disables the clamp;
  #                     env BOX_AGENT_IMAGE_MAX_DIM overrides.
  # auth_file defaults to the top-level auth_file / auth.json next to config.yaml.
  # auth_file: "/path/to/auth.json"
#
# Environment variables remain supported as process-level overrides in CLI and ACP:
# BOX_AGENT_IMAGE_GENERATION_ENDPOINT, BOX_AGENT_IMAGE_GENERATION_API_KEY,
# BOX_AGENT_IMAGE_GENERATION_TIMEOUT, BOX_AGENT_IMAGE_GEN_ENDPOINT,
# BOX_AGENT_IMAGE_GEN_API_KEY.
# Explicit `size` values are usually forwarded as-is. The standard hosted
# `/images/gen` endpoint preserves common aspect ratios while scaling to the
# minimum pixel budget and aligning both dimensions to 16. OpenAI
# `/images/generations` and Doubao/Seedream keep their provider-specific rules.

# ===== officev3 Permission Settings =====
# Optional. Only honored when this whole block is present in the loaded
# config.yaml — otherwise box-agent runs in legacy "allow_full_access" mode.
# officev3 owns this block: it writes the file then restarts box-agent-acp,
# so box-agent-acp does NOT mutate it at runtime.
#
# officev3:
#   permissions:
#     filesystem:
#       # scope semantics:
#       #   session_workspace — allow paths.session_workspace_root + workspace + allowed_directories
#       #   custom            — same as session_workspace (alias used by officev3)
#       #   user_home         — allow the entire $HOME tree
#       scope: session_workspace
#       # Extra directories appended to session_workspace / custom scopes.
#       # Paths may use ~ or absolute form.
#       allowed_directories:
#         - ~/Downloads
#         - ~/Desktop
#     memory:
#       openclaw_import: true  # allow one-time import from ~/.openclaw/
#   paths:
#     session_workspace_root: ""  # absolute path; defaults to workspace_dir if empty

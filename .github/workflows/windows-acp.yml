name: Windows ACP console interrupts

on:
  pull_request:
    paths:
      - 'box_agent/acp/__init__.py'
      - 'box_agent/tools/bash_tool.py'
      - 'box_agent/tools/jupyter_tool.py'
      - 'tests/desktop_runtime_fixture.py'
      - 'tests/test_acp_stdio.py'
      - 'tests/test_bash_tool.py'
      - 'tests/test_desktop_runtime_fixture.py'
      - 'tests/test_jupyter_runtime_python.py'
      - '.github/workflows/windows-acp.yml'

permissions:
  contents: read

jobs:
  console-and-pipes:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Verify console interrupts, tool failure and host shutdown
        run: >-
          uv run --no-sync pytest -q --tb=short
          tests/test_desktop_runtime_fixture.py::test_console_interrupt_and_tool_exit_preserve_peer_session_and_host_shutdown
          tests/test_acp_stdio.py::test_only_pipe_hosted_windows_acp_ignores_console_interrupts
          tests/test_acp_stdio.py::test_windows_pipe_hosted_acp_in_worker_uses_only_native_console_handler
          tests/test_acp_stdio.py::test_windows_console_ctrl_handler_swallows_only_ctrl_c_and_break
          tests/test_bash_tool.py::test_windows_spawn_logs_filter_command_before_the_preview_cut
          tests/test_jupyter_runtime_python.py::test_windows_kernel_launch_isolates_console_and_keeps_parent_lifetime
          tests/test_jupyter_runtime_python.py::test_sandbox_kernel_survives_its_own_python_interrupt
